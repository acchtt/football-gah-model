name: EPL baseline benchmark

on:
  push:
    branches: [main]
    paths:
      - "gah/model.py"
      - "gah/backtest.py"
      - "gah/data.py"
      - "tests/test_data.py"
      - "benchmark_epl.py"
      - "requirements.txt"
      - ".github/workflows/epl-baseline.yml"
  pull_request:
    branches: [main]
    paths:
      - "gah/model.py"
      - "gah/backtest.py"
      - "gah/data.py"
      - "tests/test_data.py"
      - "benchmark_epl.py"
      - "requirements.txt"
      - ".github/workflows/epl-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run EPL baseline
        run: python benchmark_epl.py --output benchmarks/epl_baseline.md

      - name: Commit benchmark report
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- benchmarks/epl_baseline.md; then
            echo "Benchmark report unchanged"
            exit 0
          fi
          git config user.name "football-gah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add benchmarks/epl_baseline.md
          git commit -m "Update EPL baseline benchmark"
          git push
