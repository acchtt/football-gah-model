name: GAH v2.11 durable Airtable state

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/airtable_bridge.py"
      - "gah/airtable_state.py"
      - "airtable_state_cli.py"
      - "tests/test_airtable_state.py"
      - "benchmarks/v211_airtable_state.md"
      - ".github/workflows/v211-airtable-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
