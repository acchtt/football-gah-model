name: GAH v2.6 decision lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/lifecycle.py"
      - "lifecycle_cli.py"
      - "tests/test_lifecycle.py"
      - "benchmarks/v26_decision_ledger_protocol.md"
      - ".github/workflows/v26-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
