name: EPL v1.1 totals experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run GAH v1.1 totals benchmark
        run: python benchmark_epl_v11.py --output benchmarks/epl_v11_totals.md
