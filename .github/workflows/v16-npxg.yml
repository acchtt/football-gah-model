name: GAH v1.6 non-penalty xG

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/xg.py"
      - "tests/test_xg.py"
      - "benchmark_v16_npxg.py"
      - "requirements-xg.txt"
      - ".github/workflows/v16-npxg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        competition:
          - EPL
          - BUNDESLIGA
          - LA_LIGA
          - SERIE_A
          - LIGUE_1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install xG dependencies
        run: pip install -r requirements-xg.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run ${{ matrix.competition }} npXG benchmark
        run: python benchmark_v16_npxg.py --competition "${{ matrix.competition }}"
