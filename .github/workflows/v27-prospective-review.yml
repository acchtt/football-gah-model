name: GAH v2.7 prospective review gate

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/prospective_review.py"
      - "prospective_review_cli.py"
      - "tests/test_prospective_review.py"
      - "benchmarks/v27_prospective_review_gate.md"
      - ".github/workflows/v27-prospective-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
