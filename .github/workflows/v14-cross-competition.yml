name: GAH v1.4 cross-competition validation

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/model.py"
      - "gah/backtest.py"
      - "gah/data.py"
      - "gah/totals.py"
      - "gah/markets.py"
      - "gah/calibration.py"
      - "tests/test_data.py"
      - "tests/test_totals.py"
      - "tests/test_calibration.py"
      - "benchmark_v14_league.py"
      - ".github/workflows/v14-cross-competition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        competition:
          - EPL
          - BUNDESLIGA
          - LA_LIGA
          - SERIE_A
          - LIGUE_1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run ${{ matrix.competition }} validation
        run: python benchmark_v14_league.py --competition "${{ matrix.competition }}"
