name: GAH v2.12 resumable sessions

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/resume.py"
      - "resume_cli.py"
      - "tests/test_resume.py"
      - "benchmarks/v212_resumable_sessions.md"
      - ".github/workflows/v212-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
