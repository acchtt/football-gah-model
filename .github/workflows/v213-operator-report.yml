name: GAH v2.13 forward operations report

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/operator_report.py"
      - "operator_report_cli.py"
      - "tests/test_operator_report.py"
      - "benchmarks/v213_operator_report.md"
      - ".github/workflows/v213-operator-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
