name: GAH v2.9 board session orchestrator

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/session.py"
      - "session_cli.py"
      - "tests/test_session.py"
      - "benchmarks/v29_board_session_orchestrator.md"
      - ".github/workflows/v29-board-session.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
