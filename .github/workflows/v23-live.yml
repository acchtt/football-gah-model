name: GAH v2.3 live repricing

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/live.py"
      - "live_cli.py"
      - "tests/test_live.py"
      - "benchmarks/v23_live_repricing_protocol.md"
      - ".github/workflows/v23-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
