name: GAH v2.8 Airtable operational bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/airtable_bridge.py"
      - "airtable_bridge_cli.py"
      - "tests/test_airtable_bridge.py"
      - "benchmarks/v28_airtable_operational_bridge.md"
      - ".github/workflows/v28-airtable-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
