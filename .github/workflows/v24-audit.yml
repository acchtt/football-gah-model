name: GAH v2.4 automated audit

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/audit.py"
      - "audit_cli.py"
      - "tests/test_audit.py"
      - "benchmarks/v24_audit_protocol.md"
      - ".github/workflows/v24-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
