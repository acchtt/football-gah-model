name: EPL v1.3 line calibration

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/**"
      - "tests/**"
      - "benchmark_epl_v13.py"
      - ".github/workflows/epl-v13-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run full Asian-line calibration benchmark
        run: python benchmark_epl_v13.py
