name: EPL v1.3 line calibration

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/model.py"
      - "gah/backtest.py"
      - "gah/data.py"
      - "gah/totals.py"
      - "gah/markets.py"
      - "gah/calibration.py"
      - "tests/test_data.py"
      - "tests/test_totals.py"
      - "tests/test_calibration.py"
      - "benchmark_epl_v13.py"
      - "benchmark_epl_v13_tilt.py"
      - ".github/workflows/epl-v13-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run full Asian-line calibration benchmark
        run: python benchmark_epl_v13.py

      - name: Run totals probability-tilt experiment
        run: python benchmark_epl_v13_tilt.py
