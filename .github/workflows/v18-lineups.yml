name: GAH v1.8 confirmed-XI screen

on:
  pull_request:
    branches: [main]
    paths:
      - "gah/lineups.py"
      - "tests/test_lineups.py"
      - "benchmark_v18_lineups.py"
      - ".github/workflows/v18-lineups.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: EPL_2015_16
            competition_id: 2
            season_id: 27
          - label: SERIE_A_2015_16
            competition_id: 12
            season_id: 27

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run confirmed-XI screen
        run: >
          python benchmark_v18_lineups.py
          --competition-id "${{ matrix.competition_id }}"
          --season-id "${{ matrix.season_id }}"
          --label "${{ matrix.label }}"
